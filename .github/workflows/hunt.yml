name: hunt
run-name: ${{ inputs.dry_run && 'hunt (dry run)' || (inputs.chain && 'hunt (continues)' || 'hunt') }}

# How this keeps time
# -------------------
# GitHub's own schedule cannot be relied on: after go-live it did not fire once in the first hours, and
# even when it works it is "best effort" (late, or dropped when GitHub is busy). So each run starts the
# next one itself:
#   1. Just before its check, a run starts its successor (workflow_dispatch with chain=true).
#   2. The successor waits in the environment "hunt-timer", which has a wait timer of 8 minutes. GitHub
#      holds the job back during that time; no runner is used.
#   3. Then it sleeps the last seconds up to INTERVAL_SECONDS after the previous check, starts ITS
#      successor, and does one check (about a minute).
# Because the successor exists before the check begins, a check that crashes cannot break the chain.
# The schedule below only restarts the chain if it ever stops (when GitHub's schedule works).
#
# To stop the checker: disable this workflow (Actions tab -> hunt -> "..." -> Disable workflow); the
# waiting run then ends without doing anything. To start it again: enable it and click "Run workflow".
# The environments are created by ./go-live.sh. If "hunt-timer" has no wait timer, the run simply
# sleeps the whole interval itself, so the timing stays right.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (one check, print messages, send nothing, commit nothing)"
        type: boolean
        default: false
      chain:
        description: "Internal: set by a run that starts its successor. Leave off."
        type: boolean
        default: false
      after:
        description: "Internal: Unix time at which the previous run started this one. Leave empty."
        type: string
        default: ""

permissions:
  contents: write   # commit data/ and docs/data.json
  actions: write    # start the next run; read the list of runs

env:
  INTERVAL_SECONDS: "600"   # one check every 10 minutes

jobs:
  # A run started by the schedule or by hand only continues when the chain is not alive already.
  guard:
    if: ${{ !inputs.chain && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Other runs of this workflow that have not finished (dry runs do not count).
          others="$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hunt.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.status != \"completed\") | select(.id != $GITHUB_RUN_ID)
                   | select(.display_title != \"hunt (dry run)\")] | length" 2>/dev/null || echo unknown)"
          if [ "$others" = "0" ] || [ "$others" = "unknown" ]; then
            # "unknown" (the question failed) also continues: a stopped checker is worse than a
            # doubled one, and a doubled chain ends by itself (see "Start the next run").
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The checker is already running. Nothing to do."
          fi

  hunt:
    needs: guard
    # Runs unless the guard said no (the guard is skipped for chain runs and dry runs).
    if: ${{ !cancelled() && needs.guard.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      # "hunt-timer" holds the job back for 8 minutes before it gets a runner; "hunt-now" has no rules.
      name: ${{ inputs.chain && 'hunt-timer' || 'hunt-now' }}
      deployment: false
    concurrency:
      group: ${{ inputs.dry_run && format('hunt-dry-{0}', github.run_id) || 'hunt' }}
      cancel-in-progress: false
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      AFTER: ${{ inputs.after }}
    steps:
      # Until the Telegram secrets exist (./go-live.sh sets them), do nothing: otherwise these runs would
      # quietly use up the first batch of alerts. Dry runs are always allowed.
      - name: Check setup
        id: setup
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram is not set up yet (run ./go-live.sh). Skipping this run."
          fi

      # Before the check, so that a check that goes wrong cannot break the chain.
      - name: Keep the rhythm and start the next run
        id: next
        if: ${{ steps.setup.outputs.ready == 'true' && !inputs.dry_run }}
        run: |
          api() { timeout 60 gh api "$@" 2>/dev/null; }
          tell() {
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$1" >/dev/null 2>&1 || true
            fi
          }

          # 1. Disabled in the Actions tab = the user wants the checker to stop.
          state="$(api "repos/$GITHUB_REPOSITORY/actions/workflows/hunt.yml" --jq .state || echo unknown)"
          if [ "$state" = "disabled_manually" ]; then
            echo "::notice::The workflow is disabled: stopping without a check and without a next run."
            echo "stop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. If a newer chain run is already waiting, this run is a leftover of a doubled chain
          #    (two runs started at the same moment): let the newer one carry on alone.
          newer="$(api "repos/$GITHUB_REPOSITORY/actions/workflows/hunt.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.status != \"completed\") | select(.id > $GITHUB_RUN_ID)
                   | select(.display_title == \"hunt (continues)\")] | length" || echo 0)"
          if [ "$newer" != "0" ] && [ -n "$newer" ]; then
            echo "::notice::A newer run is already waiting to continue: this one stops here."
            echo "stop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Keep the rhythm: wait until one interval after the previous run's check. Normally that is
          #    under two minutes (the environment's wait timer covers the rest); it is the whole
          #    interval only when the timer is missing.
          case "$AFTER" in
            ''|*[!0-9]*) ;;
            *)
              wait=$(( AFTER + INTERVAL_SECONDS - $(date +%s) ))
              if [ "$wait" -gt "$INTERVAL_SECONDS" ]; then wait="$INTERVAL_SECONDS"; fi
              if [ "$wait" -gt 0 ]; then
                echo "Waiting $wait s to keep the $INTERVAL_SECONDS s rhythm."
                sleep "$wait"
              fi
              ;;
          esac

          # 4. Start the successor. It waits in the "hunt-timer" environment before it does anything.
          now="$(date +%s)"
          for i in 1 2 3 4 5; do
            if timeout 60 gh workflow run hunt.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain=true -f "after=$now"; then
              echo "Started the next run."
              exit 0
            fi
            sleep $(( i * 10 ))
          done
          echo "::error::Could not start the next run."
          if [ "$state" = "active" ] || [ "$state" = "unknown" ]; then
            tell "⚠️ House Hunter could not start its next run on GitHub, so it may stop checking. Open the repo's Actions tab → hunt → Run workflow."
          else
            tell "⚠️ House Hunter has stopped: GitHub switched the workflow off (state: $state). Open the repo's Actions tab → hunt → Enable workflow, then Run workflow."
          fi
          echo "failed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: ${{ steps.setup.outputs.ready == 'true' && steps.next.outputs.stop != 'true' }}
        with:
          # the latest commit, not the one from when this run was started (it would otherwise
          # start from stale data/ and resend alerts the previous run already sent)
          ref: main

      - uses: actions/setup-python@v7
        if: ${{ steps.setup.outputs.ready == 'true' && steps.next.outputs.stop != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - run: timeout 300 pip install -r requirements.txt
        if: ${{ steps.setup.outputs.ready == 'true' && steps.next.outputs.stop != 'true' }}

      - name: Hunt
        if: ${{ steps.setup.outputs.ready == 'true' && steps.next.outputs.stop != 'true' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m hunter run --dry-run
            exit 0
          fi
          timeout 480 python -m hunter run

      - name: Commit state
        # also after a failed hunt step (a crash): otherwise alerts would repeat
        if: ${{ !cancelled() && !inputs.dry_run && steps.setup.outputs.ready == 'true' && steps.next.outputs.stop != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f data/*.tmp docs/*.tmp
          git add -A -- data docs
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -q -m "data: $(date -u +'%Y-%m-%d %H:%MZ')"
          for i in 1 2 3; do
            if timeout 120 git pull -q --rebase && timeout 120 git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after 3 tries"
          exit 1

      # If the successor could not be started at the beginning, try once more now.
      - name: Start the next run (second try)
        if: ${{ always() && steps.next.outputs.failed == 'true' }}
        run: |
          for i in 1 2 3; do
            if timeout 60 gh workflow run hunt.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain=true -f "after=$(date +%s)"; then
              echo "Started the next run."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Could not start the next run."
          exit 1
