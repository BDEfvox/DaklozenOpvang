name: hunt
run-name: ${{ inputs.dry_run && 'hunt (dry run)' || (inputs.chain && 'hunt (continues)' || 'hunt') }}

# How this keeps time
# -------------------
# GitHub's own schedule cannot be relied on: after go-live it did not fire once in the first hours, and
# even when it works it is "best effort" (late, or dropped when GitHub is busy). So each run starts the
# next one itself:
#   1. As its very first action a run starts its successor (workflow_dispatch with chain=true).
#   2. The successor first waits for this run to finish (concurrency group), then in the environment
#      "hunt-timer", which has a wait timer of 8 minutes. GitHub holds the job back during that time;
#      no runner is used.
#   3. When it gets a runner it starts ITS successor, sleeps the last minute or so up to
#      INTERVAL_SECONDS after the previous check, and does one check (about a minute).
# Because the successor exists before the check begins, a check that crashes cannot break the chain.
# The schedule below only restarts the chain if it ever stops (when GitHub's schedule works).
#
# To stop the checker: disable this workflow (Actions tab -> hunt -> "..." -> Disable workflow); the
# waiting run then ends without doing anything. To start it again: enable it and click "Run workflow".
# The environments are created by ./go-live.sh. If "hunt-timer" loses its wait timer, the run sleeps the
# whole interval on the runner instead (the timing stays right) and warns the Telegram group every six
# hours, because keeping a runner busy all day is not what GitHub's runners are for: restore the timer
# (repo Settings -> Environments -> hunt-timer -> Wait timer: 8).

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (one check, print messages, send nothing, commit nothing)"
        type: boolean
        default: false
      chain:
        description: "Internal: set by a run that starts its successor. Leave off."
        type: boolean
        default: false
      after:
        description: "Internal: Unix time at which the previous run started this one. Leave empty."
        type: string
        default: ""

permissions:
  contents: write   # commit data/ and docs/data.json
  actions: write    # start the next run; read the list of runs

env:
  INTERVAL_SECONDS: "600"   # one check every 10 minutes

jobs:
  # A run started by the schedule or by hand only continues when the chain is not alive already.
  guard:
    if: ${{ !inputs.chain && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Unfinished runs that mean the chain is alive: any waiting or running chain run, and any
          # older run started by the schedule or by hand (dry runs do not count). Two runs started at
          # the same moment therefore do not both step aside: the older one continues.
          others="$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hunt.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.status != \"completed\") | select(.id != $GITHUB_RUN_ID)
                   | select(.display_title != \"hunt (dry run)\")
                   | select(.id < $GITHUB_RUN_ID or .display_title == \"hunt (continues)\")] | length" 2>/dev/null)" || others=unknown
          # On an error gh prints the error text instead of a number: treat anything else as unknown.
          case "$others" in ''|*[!0-9]*) others=unknown ;; esac
          if [ "$others" = "0" ] || [ "$others" = "unknown" ]; then
            # "unknown" (the question failed) also continues: a stopped checker is worse than a
            # doubled one, and a doubled chain ends by itself (see "Start the next run").
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The checker is already running. Nothing to do."
          fi

  hunt:
    needs: guard
    # Runs unless the guard said no (the guard is skipped for chain runs and dry runs).
    if: ${{ !cancelled() && needs.guard.outputs.go != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      # "hunt-timer" holds the job back for 8 minutes before it gets a runner; "hunt-now" has no rules.
      name: ${{ inputs.chain && 'hunt-timer' || 'hunt-now' }}
      deployment: false
    concurrency:
      group: ${{ inputs.dry_run && format('hunt-dry-{0}', github.run_id) || 'hunt' }}
      cancel-in-progress: false
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
      AFTER: ${{ inputs.after }}
    steps:
      # Until the Telegram secrets exist (./go-live.sh sets them), do nothing: otherwise these runs would
      # quietly use up the first batch of alerts. Dry runs are always allowed.
      - name: Check setup
        id: setup
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Telegram is not set up yet (run ./go-live.sh). Skipping this run."
          fi

      # First of all, so that nothing that goes wrong later (a crashed check, a lost runner) can break
      # the chain. The successor cannot start early: it waits for this job to end, then for the timer.
      - name: Start the next run and keep the rhythm
        id: next
        if: ${{ steps.setup.outputs.ready == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { timeout 60 gh api "$@" 2>/dev/null; }

          # 1. Disabled in the Actions tab = the user wants the checker to stop.
          #    (On an error gh prints the error text: anything that is not a plain word counts as unknown.)
          state="$(api "repos/$GITHUB_REPOSITORY/actions/workflows/hunt.yml" --jq .state)" || state=unknown
          case "$state" in ''|*[!a-z_]*) state=unknown ;; esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = "disabled_manually" ]; then
            echo "::notice::The workflow is disabled: stopping without a check and without a next run."
            echo "stop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. If a newer chain run is already waiting, this run is a leftover of a doubled chain
          #    (two runs started at the same moment): let the newer one carry on alone. Only a clear
          #    answer counts; when the question fails, carry on (a stopped checker is the worse outcome).
          newer="$(api "repos/$GITHUB_REPOSITORY/actions/workflows/hunt.yml/runs?per_page=100" \
            --jq "[.workflow_runs[] | select(.status != \"completed\") | select(.id > $GITHUB_RUN_ID)
                   | select(.display_title == \"hunt (continues)\")] | length")" || newer=0
          case "$newer" in ''|*[!0-9]*) newer=0 ;; esac
          if [ "$newer" != "0" ]; then
            echo "::notice::A newer run is already waiting to continue: this one stops here."
            echo "stop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. When is this run's check due? One interval after the previous one (AFTER). Normally
          #    that is about a minute from now, because the environment's wait timer covered the rest.
          wait=0
          case "$AFTER" in
            ''|0*|*[!0-9]*) ;;
            *)
              wait=$(( AFTER + INTERVAL_SECONDS - $(date +%s) ))
              if [ "$wait" -gt "$INTERVAL_SECONDS" ]; then wait="$INTERVAL_SECONDS"; fi
              if [ "$wait" -lt 0 ]; then wait=0; fi
              ;;
          esac
          due=$(( $(date +%s) + wait ))

          # 4. Start the successor now, telling it when this run's check is due.
          started=false
          for i in 1 2 3 4 5; do
            if timeout 60 gh workflow run hunt.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain=true -f "after=$due"; then
              echo "Started the next run."
              started=true
              break
            fi
            sleep $(( i * 10 ))
          done
          if [ "$started" != "true" ]; then
            echo "::warning::Could not start the next run yet; trying again after the check."
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

          # 5. A long wait here means the hunt-timer environment has no wait timer, so this run keeps a
          #    runner busy for the whole interval. Keep checking, but say so (about every six hours).
          if [ "$wait" -gt 180 ]; then
            echo "::warning::Waiting $wait s on the runner: the hunt-timer environment has no wait timer (repo Settings -> Environments -> hunt-timer -> Wait timer: 8)."
            if [ $(( $(date -u +%-H) % 6 )) -eq 0 ] && [ "$(date -u +%-M)" -lt 10 ] \
               && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=⚠️ House Hunter still works, but its timer on GitHub is missing, so it keeps a GitHub runner busy all day. Fix: repo Settings → Environments → hunt-timer → Wait timer: 8 minutes." \
                >/dev/null 2>&1 || true
            fi
          fi

          # 6. Sleep the rest, so checks stay one interval apart.
          rest=$(( due - $(date +%s) ))
          if [ "$rest" -gt 0 ]; then
            echo "Waiting $rest s to keep the $INTERVAL_SECONDS s rhythm."
            sleep "$rest"
          fi

      # Optional: also start a second checker that lives in another repository of the owner (its GitHub
      # schedule does not fire either). Does nothing unless the secrets NUDGE_REPO ("owner/name") and
      # NUDGE_TOKEN (a token that may only start workflows in that one repository) exist. Every 30
      # minutes by day, hourly from midnight to 06:00 Dutch winter time. Runs before any code from
      # this repository is checked out, and only this step sees the token.
      - name: Start the second checker
        if: ${{ steps.setup.outputs.ready == 'true' && !inputs.dry_run && steps.next.outputs.stop != 'true' }}
        continue-on-error: true
        env:
          NUDGE_REPO: ${{ secrets.NUDGE_REPO }}
          NUDGE_TOKEN: ${{ secrets.NUDGE_TOKEN }}
        run: |
          if [ -z "$NUDGE_REPO" ] || [ -z "$NUDGE_TOKEN" ]; then
            echo "Not set up."
            exit 0
          fi
          slot=$(( $(date +%s) / INTERVAL_SECONDS ))
          hour=$(date -u +%-H)
          every=3
          if [ "$hour" -ge 23 ] || [ "$hour" -lt 5 ]; then every=6; fi
          if [ $(( slot % every )) -ne 0 ]; then
            echo "Not this time (every ${every}th check)."
            exit 0
          fi
          code="$(curl -s -m 30 -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $NUDGE_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$NUDGE_REPO/actions/workflows/hunt.yml/dispatches" \
            -d '{"ref":"main"}')" || code=000
          case "$code" in
            2*) echo "Started the second checker." ;;
            *)  echo "::warning::Could not start the second checker (HTTP $code). If the token expired, make a new one."; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        id: checkout
        if: ${{ steps.setup.outputs.ready == 'true' && steps.next.outputs.stop != 'true' }}
        with:
          # the latest commit, not the one from when this run was started (it would otherwise
          # start from stale data/ and resend alerts the previous run already sent)
          ref: main

      - uses: actions/setup-python@v7
        if: ${{ steps.setup.outputs.ready == 'true' && steps.next.outputs.stop != 'true' }}
        with:
          python-version: "3.12"
          cache: pip

      - run: timeout 300 pip install -r requirements.txt
        if: ${{ steps.setup.outputs.ready == 'true' && steps.next.outputs.stop != 'true' }}

      - name: Hunt
        if: ${{ steps.setup.outputs.ready == 'true' && steps.next.outputs.stop != 'true' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m hunter run --dry-run
            exit 0
          fi
          timeout 480 python -m hunter run

      - name: Commit state
        # also after a failed or cancelled hunt step: its alerts were sent, so they must be remembered
        if: ${{ always() && !inputs.dry_run && steps.checkout.outcome == 'success' && steps.next.outputs.stop != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f data/*.tmp docs/*.tmp
          git add -A -- data docs
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          msg="data: $(date -u +'%Y-%m-%d %H:%MZ')"
          git commit -q -m "$msg"
          for i in 1 2 3; do
            if timeout 120 git pull -q --rebase && timeout 120 git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          # Still not pushed: someone else changed data/ on GitHub. This run's state is the newest
          # (it holds the alerts just sent), so put it on top of GitHub's version as it is. That
          # discards the other change to data/: stop the checker before editing those files by hand.
          keep="$(mktemp -d)"
          cp -R data "$keep/data"
          if [ -f docs/data.json ]; then cp docs/data.json "$keep/data.json"; fi
          timeout 120 git fetch -q origin main
          git reset -q --hard origin/main
          rm -rf data
          cp -R "$keep/data" data
          if [ -f "$keep/data.json" ]; then cp "$keep/data.json" docs/data.json; fi
          git add -A -- data docs
          git diff --cached --quiet || git commit -q -m "$msg"
          timeout 120 git push -q

      # If the successor could not be started at the beginning: keep trying for about fifteen minutes,
      # and only then tell the group.
      - name: Start the next run (second try)
        if: ${{ !cancelled() && steps.next.outputs.failed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.next.outputs.state }}
        run: |
          end=$(( SECONDS + 900 ))
          while [ "$SECONDS" -lt "$end" ]; do
            if timeout 60 gh workflow run hunt.yml --repo "$GITHUB_REPOSITORY" --ref main -f chain=true -f "after=$(date +%s)"; then
              echo "Started the next run."
              exit 0
            fi
            sleep 45
          done
          echo "::error::Could not start the next run."
          if [ "$STATE" = "active" ] || [ "$STATE" = "unknown" ] || [ -z "$STATE" ]; then
            text="⚠️ House Hunter could not start its next run on GitHub, so it has probably stopped checking. Open the repo's Actions tab → hunt → Run workflow."
          else
            text="⚠️ House Hunter has stopped: GitHub switched the workflow off (state: $STATE). Open the repo's Actions tab → hunt → Enable workflow, then Run workflow."
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -m 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$text" >/dev/null 2>&1 || true
          fi
          exit 1
